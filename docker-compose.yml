version: '3.8'

services:
  collabsphere-db:
    image: mysql:8.0
    container_name: collabsphere-mysql
    restart: always
    environment:
      MYSQL_DATABASE: collabspheredb
      MYSQL_USER: collabsphere
      MYSQL_PASSWORD: ${DB_PASSWORD:-CollabSphereSecure2026!}
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD:-CollabSphereRoot2026!}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  collabsphere-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collabsphere-backend
    restart: always
    depends_on:
      collabsphere-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      url: jdbc:mysql://collabsphere-db:3306/collabspheredb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      username: collabsphere
      password: ${DB_PASSWORD:-CollabSphereSecure2026!}
      driverClassName: com.mysql.cj.jdbc.Driver

volumes:
  mysql_data:
