spring.application.name=Digital_Whiteboard

# Datasource configuration with H2 default fallback if ${url} is not provided
spring.datasource.url=${url:jdbc:h2:file:./data/collabspheredb;AUTO_SERVER=TRUE}
spring.datasource.username=${username:sa}
spring.datasource.password=${password:}
spring.datasource.driver-class-name=${driverClassName:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Server configuration
server.port=8080



